server:
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mongodb:
    uri: ${MONGODB_URI}

logging:
  level:
    root: INFO
    com:
      argos: DEBUG
