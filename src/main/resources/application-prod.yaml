server:
  servlet:
    context-path: /api/v1

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE:3}
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

logging:
  level:
    root: INFO
    com.argos: DEBUG

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:#{null}}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    enabled: false
