server:
   servlet:
    context-path: /api/v1
   port: ${PORT:8080}
   address: 0.0.0.0

spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false


  mongodb:
    uri: ${MONGODB_URI}


logging:
  level:
    root: WARN
    com:
      argos: INFO


