server:
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app_db}
    username: ${DATASOURCE_USER:app_user}
    password: ${DATASOURCE_PASSWORD:postgresArgos01!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    baseline-on-migrate: false

  mongodb:
    uri: mongodb://localhost:${MONGO_PORT:27017}/${MONGO_DB:app_db}

logging:
  level:
    root: INFO
    com:
      argos: DEBUG

firebase:
  service-account-path: classpath:firebase-service-account.json

security:
  jwt:
    secret: ${JWT_SECRET:local-secret-minimo-32-caracteres-para-hs256}
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    enabled: true
