name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean package -Dspring.profiles.active=test

      - name: Stage app.jar
        run: cp target/app.jar app.jar

      - name: Swap config for homolog (develop -> argos-backend-hmg)
        if: github.ref_name == 'develop'
        run: cp discloud.config.homolog discloud.config

      - name: Check deploy files
        run: |
          ls -lh app.jar
          ls -lh discloud.config

      - name: Deploy to Discloud
        uses: discloud/deploy-action@v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          glob: |
            app.jar
            discloud.config