name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Build and run tests
        run: >
          ./mvnw -B clean package -Dspring.profiles.active=test
          -Dspring-boot.excludeGroupIds=io.grpc,com.google.cloud,org.conscrypt

      - name: Stage app.jar
        run: cp target/app.jar app.jar

      - name: Validate deploy artifact size
        run: |
          ls -lh app.jar
          max_size=$((100 * 1024 * 1024))
          app_size=$(stat -c%s app.jar)
          if [ "$app_size" -gt "$max_size" ]; then
            echo "app.jar exceeds Discloud ZIP limit (100 MB): ${app_size} bytes"
            exit 1
          fi

      - name: Swap config for homolog (develop -> argos-backend-hmg)
        if: github.ref_name == 'develop'
        run: cp discloud.config.homolog discloud.config

      - name: Deploy to Discloud
        uses: discloud/deploy-action@v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
