apiVersion: apps/v1
kind: Deployment
metadata:
  name: argos-backend
  labels:
    app.kubernetes.io/name: argos-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argos-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argos-backend
    spec:
      containers:
        - name: argos-backend
          image: argos-backend-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: argos-backend-config
            - secretRef:
                name: argos-backend-secrets
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
